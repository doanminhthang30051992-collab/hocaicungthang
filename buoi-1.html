<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tài Liệu Xuất Phát | Thắng TST</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Tài liệu buổi 1 khoá học AI Claude. Nội dung bảo vệ bằng mật khẩu." />
  <style>
    :root {
      --primary: #f97316;
      --primary-dark: #ea6c0a;
      --accent: #f97316;
      --accent-dark: #ea6c0a;
      --dark: #080808;
      --dark2: #0f0f0f;
      --dark3: #141414;
      --text: #ffffff;
      --muted: #9a9a9a;
      --white: #ffffff;
      --card-bg: rgba(249,115,22,0.07);
      --border: rgba(249,115,22,0.22);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--dark);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
    }
    a { color: var(--accent); }

    /* HEADER */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 14px 24px;
      background: rgba(15,10,30,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 8px; text-decoration:none; }
    .logo-name { font-weight: 900; font-size: 1.2rem; color: #fff; }
    .logo-x { font-size: 1rem; color: var(--accent); font-weight: 700; }
    header a.cta-nav {
      background: var(--accent); color: #000;
      padding: 8px 20px; border-radius: 50px;
      text-decoration: none; font-weight: 700; font-size: .9rem;
      transition: background .2s;
    }
    header a.cta-nav:hover { background: var(--accent-dark); }

    /* GATE */
    .gate {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 120px 24px 60px; text-align: center;
      background:
        radial-gradient(circle at 50% 30%, rgba(249,115,22,0.14), transparent 60%),
        var(--dark);
    }
    .gate-card {
      width: 100%; max-width: 440px;
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .gate-lock { font-size: 3rem; margin-bottom: 12px; }
    .gate-card h1 { font-size: 1.5rem; margin-bottom: 8px; }
    .gate-card p.sub { color: var(--muted); font-size: .95rem; margin-bottom: 24px; }
    .gate-card input {
      width: 100%; padding: 14px 16px;
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #fff; font-size: 1rem; margin-bottom: 14px;
      outline: none;
    }
    .gate-card input:focus { border-color: var(--accent); }
    .gate-card button {
      width: 100%; padding: 14px;
      background: var(--accent); color: #000;
      border: none; border-radius: 12px;
      font-weight: 800; font-size: 1rem; cursor: pointer;
      transition: background .2s;
    }
    .gate-card button:hover { background: var(--accent-dark); }
    .gate-err {
      color: #ff6b6b; font-size: .9rem; margin-top: 14px; min-height: 20px;
    }

    /* ARTICLE */
    .wrap {
      max-width: 820px; margin: 0 auto;
      padding: 110px 24px 80px;
      display: none;
    }
    .wrap .kicker {
      color: var(--accent); font-weight: 800; letter-spacing: 1px;
      text-transform: uppercase; font-size: .82rem; margin-bottom: 10px;
    }
    .wrap h1.page-title {
      font-size: 2.1rem; line-height: 1.25; margin-bottom: 28px;
    }
    article p { margin-bottom: 18px; color: #e8e8e8; }
    article p.lead { font-size: 1.18rem; color: #fff; font-weight: 600; }
    article p.sig { color: var(--accent); font-weight: 700; margin-top: -4px; }
    article h2 {
      font-size: 1.55rem; margin: 42px 0 16px;
      padding-top: 26px; border-top: 1px solid var(--border);
    }
    article h3 { font-size: 1.15rem; margin: 8px 0 12px; color: #fff; }
    article ul { margin: 0 0 18px 20px; }
    article li { margin-bottom: 12px; color: #e8e8e8; }
    article code {
      background: rgba(249,115,22,0.14); color: #ffcfa3;
      padding: 2px 7px; border-radius: 6px; font-size: .92em;
    }
    article blockquote {
      border-left: 3px solid var(--accent);
      background: var(--card-bg);
      padding: 16px 20px; margin: 22px 0; border-radius: 0 12px 12px 0;
      font-style: italic; color: #fff;
    }
    article blockquote cite { display:block; margin-top:8px; font-style:normal; color: var(--muted); font-size:.9rem; }
    article hr { border: none; border-top: 1px solid var(--border); margin: 40px 0; }
    article p.end { text-align:center; color: var(--muted); font-style: italic; }

    .layer, .step {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px; margin: 18px 0;
    }
    .step { position: relative; }
    .step-num {
      display: inline-block;
      background: var(--accent); color:#000;
      font-weight: 800; font-size: .82rem;
      padding: 4px 14px; border-radius: 50px; margin-bottom: 10px;
    }
    .note {
      background: rgba(255,255,255,0.04);
      border-left: 3px solid var(--accent);
      padding: 12px 16px; border-radius: 0 10px 10px 0;
      font-size: .95rem; color: #d0d0d0;
    }

    .prompt-box {
      position: relative;
      background: #0a0a0a;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin: 16px 0;
    }
    .prompt-box pre {
      white-space: pre-wrap; word-wrap: break-word;
      font-family: 'Consolas','Courier New',monospace;
      font-size: .86rem; line-height: 1.55; color: #cfe;
      padding: 44px 18px 18px; margin: 0;
      max-height: 360px; overflow-y: auto;
    }
    .copy-btn {
      position: absolute; top: 10px; right: 10px; z-index: 2;
      background: var(--accent); color:#000;
      border: none; border-radius: 8px;
      padding: 6px 14px; font-weight: 700; font-size: .8rem; cursor: pointer;
    }
    .copy-btn:hover { background: var(--accent-dark); }

    footer {
      text-align: center; padding: 30px 24px;
      border-top: 1px solid var(--border); color: var(--muted); font-size: .9rem;
    }
    @media (max-width: 600px) {
      .wrap h1.page-title { font-size: 1.6rem; }
      article h2 { font-size: 1.3rem; }
    }
  </style>
</head>

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  async function unlock(password) {
    const salt = b64ToBytes(ENC.salt);
    const iv = b64ToBytes(ENC.iv);
    const ct = b64ToBytes(ENC.ct);
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: ENC.iter, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-CBC', length: 256 },
      false, ['decrypt']
    );
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, key, ct);
    const text = new TextDecoder().decode(plainBuf);
    if (!text.startsWith('OK::')) throw new Error('bad');
    return text.slice(4);
  }

  const form = document.getElementById('gateForm');
  const errEl = document.getElementById('err');
  const btn = document.getElementById('btnUnlock');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    errEl.textContent = '';
    btn.textContent = 'Đang mở…'; btn.disabled = true;
    try {
      const html = await unlock(pw);
      document.getElementById('content').innerHTML = html;
      document.getElementById('gate').style.display = 'none';
      document.getElementById('wrap').style.display = 'block';
      document.getElementById('foot').style.display = 'block';
      window.scrollTo(0, 0);
    } catch (err) {
      errEl.textContent = 'Sai mật khẩu. Vui lòng thử lại.';
      btn.textContent = 'Mở khoá'; btn.disabled = false;
      document.getElementById('pw').select();
    }
  });

  function copyPrompt(btnEl) {
    const pre = btnEl.parentElement.querySelector('pre');
    navigator.clipboard.writeText(pre.innerText).then(() => {
      const old = btnEl.textContent;
      btnEl.textContent = 'Đã copy ✓';
      setTimeout(() => { btnEl.textContent = old; }, 1600);
    });
  }
</script>
